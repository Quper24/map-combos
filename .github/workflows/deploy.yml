name: Deploy website to Linux

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quper-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test deployment validation and rollback
        run: python3 -m unittest discover -s deploy -p 'test_publish_site.py'
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/quper-site
          chmod 600 ~/.ssh/quper-site
          cp deploy/ssh_known_hosts ~/.ssh/known_hosts
      - name: Publish site atomically
        env:
          DEPLOY_HOST: 176.12.65.63
        run: |
          tar -czf "$RUNNER_TEMP/site.tar.gz" -C dist .
          ssh -i ~/.ssh/quper-site -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "quper-deploy@$DEPLOY_HOST" "publish $GITHUB_SHA" < "$RUNNER_TEMP/site.tar.gz"
      - name: Remove temporary key
        if: always()
        run: rm -f ~/.ssh/quper-site
